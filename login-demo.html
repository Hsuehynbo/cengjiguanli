<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录页设计稿</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap');

body {
  min-height: 100vh;
  font-family: 'Noto Sans SC', -apple-system, sans-serif;
  background: #000d1a;
  overflow: hidden;
}

.login-page {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  background: radial-gradient(ellipse at 20% 50%, #0a1f3d 0%, #000d1a 50%, #000510 100%);
}

/* ===== 动态星空背景 ===== */
.stars {
  position: absolute;
  inset: 0;
  overflow: hidden;
}
.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: #fff;
  border-radius: 50%;
  animation: twinkle var(--dur) ease-in-out infinite;
  opacity: 0;
}
@keyframes twinkle {
  0%, 100% { opacity: 0; }
  50% { opacity: var(--max-opacity); }
}

/* ===== 流光粒子 ===== */
.particles {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.particle {
  position: absolute;
  width: var(--size);
  height: var(--size);
  background: radial-gradient(circle, #00d4ff, transparent);
  border-radius: 50%;
  animation: floatUp var(--duration) linear infinite;
  animation-delay: var(--delay);
  opacity: 0;
}
@keyframes floatUp {
  0%   { opacity: 0; transform: translateY(0) translateX(0) scale(0.5); }
  15%  { opacity: 0.8; }
  85%  { opacity: 0.3; }
  100% { opacity: 0; transform: translateY(-100vh) translateX(var(--drift)) scale(1.2); }
}

/* ===== 光晕背景 ===== */
.glow-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  animation: orbPulse 8s ease-in-out infinite;
}
.glow-orb.orb1 {
  width: 400px; height: 400px;
  background: rgba(0, 100, 255, 0.12);
  top: -100px; left: -100px;
  animation-delay: 0s;
}
.glow-orb.orb2 {
  width: 300px; height: 300px;
  background: rgba(0, 212, 255, 0.08);
  bottom: -50px; right: -50px;
  animation-delay: 4s;
}
.glow-orb.orb3 {
  width: 200px; height: 200px;
  background: rgba(0, 255, 200, 0.06);
  top: 50%; left: 60%;
  animation-delay: 2s;
}
@keyframes orbPulse {
  0%, 100% { transform: scale(1); opacity: 0.6; }
  50% { transform: scale(1.3); opacity: 1; }
}

/* ===== 网格线 ===== */
.grid-lines {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  animation: gridShift 20s linear infinite;
}
@keyframes gridShift {
  0% { transform: translate(0, 0); }
  100% { transform: translate(60px, 60px); }
}

/* ===== 登录卡片 ===== */
.login-card {
  width: 440px;
  background: rgba(0, 15, 35, 0.7);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(0, 212, 255, 0.15);
  border-radius: 16px;
  padding: 44px 40px 36px;
  position: relative;
  z-index: 10;
  animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  opacity: 0;
  transform: translateY(40px) scale(0.96);
  box-shadow:
    0 0 80px rgba(0, 212, 255, 0.06),
    0 20px 60px rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.05);
}
@keyframes cardAppear {
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* 顶部光带 */
.login-card::before {
  content: '';
  position: absolute;
  top: 0; left: 40px; right: 40px;
  height: 1px;
  background: linear-gradient(90deg, transparent, #00d4ff, #00ffff, #00d4ff, transparent);
  animation: topGlow 3s ease-in-out infinite;
}
@keyframes topGlow {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

/* 角落装饰 */
.corner {
  position: absolute;
  width: 20px;
  height: 20px;
  border-color: rgba(0, 212, 255, 0.4);
  border-style: solid;
  border-width: 0;
}
.corner.tl { top: -1px; left: -1px; border-top-width: 2px; border-left-width: 2px; border-top-left-radius: 16px; }
.corner.tr { top: -1px; right: -1px; border-top-width: 2px; border-right-width: 2px; border-top-right-radius: 16px; }
.corner.bl { bottom: -1px; left: -1px; border-bottom-width: 2px; border-left-width: 2px; border-bottom-left-radius: 16px; }
.corner.br { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; border-bottom-right-radius: 16px; }

/* ===== Logo ===== */
.logo-section {
  text-align: center;
  margin-bottom: 28px;
}
.logo-img-wrapper {
  text-align: center;
  margin-bottom: 16px;
}
.logo-img {
  height: 56px;
  filter: brightness(1.2) drop-shadow(0 0 12px rgba(0, 212, 255, 0.3));
  animation: logoPulse 3s ease-in-out infinite;
}
@keyframes logoPulse {
  0%, 100% { filter: brightness(1.2) drop-shadow(0 0 12px rgba(0, 212, 255, 0.3)); }
  50% { filter: brightness(1.4) drop-shadow(0 0 20px rgba(0, 212, 255, 0.5)); }
}

.login-title {
  font-size: 22px;
  font-weight: 700;
  background: linear-gradient(90deg, #00d4ff, #00ffff, #00d4ff);
  background-size: 200% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: textShimmer 4s linear infinite;
  letter-spacing: 2px;
  margin-bottom: 6px;
}
@keyframes textShimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.login-subtitle {
  font-size: 11px;
  color: #4a6a8a;
  letter-spacing: 3px;
  text-transform: uppercase;
}

/* ===== 表单 ===== */
.form-group {
  margin-bottom: 20px;
  position: relative;
}
.form-label {
  display: block;
  font-size: 12px;
  color: #5a7a9a;
  margin-bottom: 8px;
  letter-spacing: 1px;
}
.input-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}
.input-icon {
  position: absolute;
  left: 14px;
  font-size: 16px;
  color: rgba(0, 212, 255, 0.4);
  transition: color 0.3s;
  z-index: 1;
}
.form-input {
  width: 100%;
  height: 48px;
  padding: 0 16px 0 42px;
  background: rgba(0, 212, 255, 0.04);
  border: 1px solid rgba(0, 212, 255, 0.12);
  border-radius: 8px;
  color: #ccd6f6;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: all 0.3s;
}
.form-input::placeholder {
  color: #3a5a7a;
}
.form-input:focus {
  border-color: rgba(0, 212, 255, 0.5);
  background: rgba(0, 212, 255, 0.08);
  box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.08), 0 0 20px rgba(0, 212, 255, 0.1);
}
.form-input:focus + .input-line {
  transform: scaleX(1);
}
.form-input:focus ~ .input-icon {
  color: rgba(0, 212, 255, 0.8);
}
.input-line {
  position: absolute;
  bottom: 0; left: 10%; right: 10%;
  height: 2px;
  background: linear-gradient(90deg, transparent, #00d4ff, transparent);
  transform: scaleX(0);
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  border-radius: 1px;
}

/* 密码可见切换 */
.pwd-toggle {
  position: absolute;
  right: 14px;
  background: none;
  border: none;
  color: #4a6a8a;
  cursor: pointer;
  font-size: 16px;
  transition: color 0.3s;
  z-index: 1;
}
.pwd-toggle:hover { color: #00d4ff; }

/* ===== 登录按钮 ===== */
.login-btn {
  width: 100%;
  height: 50px;
  margin-top: 8px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 6px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, #0055aa, #0088cc, #00bbff);
  background-size: 200% 200%;
  color: #fff;
  font-family: inherit;
  transition: all 0.4s;
  box-shadow: 0 4px 20px rgba(0, 100, 200, 0.3);
}
.login-btn:hover {
  background-position: 100% 100%;
  box-shadow: 0 4px 30px rgba(0, 150, 255, 0.5);
  transform: translateY(-1px);
}
.login-btn:active {
  transform: translateY(0);
  box-shadow: 0 2px 15px rgba(0, 150, 255, 0.4);
}
.login-btn .btn-shine {
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  animation: btnShine 3s ease-in-out infinite;
}
@keyframes btnShine {
  0% { left: -100%; }
  50% { left: 100%; }
  100% { left: 100%; }
}

/* 加载动画 */
.login-btn.loading {
  pointer-events: none;
  opacity: 0.8;
}
.spinner {
  display: inline-block;
  width: 18px;
  height: 18px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== 底部 ===== */
.footer-text {
  text-align: center;
  margin-top: 24px;
  font-size: 11px;
  color: #3a5a7a;
  letter-spacing: 1px;
}


/* ===== 扫描线效果 ===== */
.scan-line {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.3), transparent);
  animation: scanDown 6s linear infinite;
  pointer-events: none;
  z-index: 5;
}
@keyframes scanDown {
  0% { top: 0; opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { top: 100%; opacity: 0; }
}

/* ===== 响应式 ===== */
@media (max-width: 480px) {
  .login-card {
    width: calc(100% - 32px);
    padding: 32px 24px;
    margin: 16px;
  }
}
</style>
</head>
<body>

<div class="login-page">
  <!-- 星空背景 -->
  <div class="stars" id="stars"></div>

  <!-- 流光粒子 -->
  <div class="particles" id="particles"></div>

  <!-- 光晕 -->
  <div class="glow-orb orb1"></div>
  <div class="glow-orb orb2"></div>
  <div class="glow-orb orb3"></div>

  <!-- 网格 -->
  <div class="grid-lines"></div>

  <!-- 扫描线 -->
  <div class="scan-line"></div>

  <!-- 登录卡片 -->
  <div class="login-card">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <!-- Logo -->
    <div class="logo-section">
      <div class="logo-img-wrapper">
        <img src="frontend/public/img/yhga.png" alt="云和县公安局" class="logo-img" />
      </div>
      <h1 class="login-title">云和县公安局层级管理系统</h1>
      <p class="login-subtitle">Hierarchy Management System</p>
    </div>

    <!-- 表单 -->
    <form id="loginForm" onsubmit="return false;">
      <div class="form-group">
        <label class="form-label">工 号</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input class="form-input" type="text" placeholder="请输入工号" id="jobNo" autocomplete="off" />
          <div class="input-line"></div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">密 码</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input class="form-input" type="password" placeholder="请输入密码" id="password" style="padding-right: 42px;" />
          <button type="button" class="pwd-toggle" onclick="togglePwd()">👁️</button>
          <div class="input-line"></div>
        </div>
      </div>

      <button type="submit" class="login-btn" id="loginBtn" onclick="handleLogin()">
        <span class="btn-shine"></span>
        <span id="btnText">登 录</span>
      </button>
    </form>

    <div class="footer-text">云和县公安局 · 层级管理系统</div>
  </div>
</div>

<script>
// 生成星空
(function() {
  const stars = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.setProperty('--dur', (2 + Math.random() * 4) + 's');
    s.style.setProperty('--max-opacity', (0.3 + Math.random() * 0.7));
    s.style.animationDelay = Math.random() * 5 + 's';
    s.style.width = (1 + Math.random() * 2) + 'px';
    s.style.height = s.style.width;
    stars.appendChild(s);
  }
})();

// 生成流光粒子
(function() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 25; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 3 + Math.random() * 5;
    p.style.setProperty('--size', size + 'px');
    p.style.setProperty('--duration', (6 + Math.random() * 8) + 's');
    p.style.setProperty('--delay', Math.random() * 10 + 's');
    p.style.setProperty('--drift', (Math.random() * 100 - 50) + 'px');
    p.style.left = Math.random() * 100 + '%';
    p.style.bottom = '-20px';
    container.appendChild(p);
  }
})();

// 密码可见切换
function togglePwd() {
  const input = document.getElementById('password');
  const btn = document.querySelector('.pwd-toggle');
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
  } else {
    input.type = 'password';
    btn.textContent = '👁️';
  }
}

// 登录动画
function handleLogin() {
  const btn = document.getElementById('loginBtn');
  const text = document.getElementById('btnText');
  btn.classList.add('loading');
  text.innerHTML = '<span class="spinner"></span>登录中...';
  setTimeout(() => {
    btn.classList.remove('loading');
    text.textContent = '登 录';
  }, 2000);
}
</script>
</body>
</html>
