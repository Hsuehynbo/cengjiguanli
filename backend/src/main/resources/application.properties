# 数据库配置 (请通过环境变量设置 DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/company_talk_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Jackson日期序列化
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# 服务器配置
server.port=8080

# 文件上传
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT配置 (请通过环境变量设置 JWT_SECRET)
jwt.secret=${JWT_SECRET:cengjiguanli-system-jwt-secret-key-32b!}
jwt.expiration=86400000

# 操作日志
logging.level.AUDIT=INFO
logging.file.name=logs/audit.log
logging.logback.rollingpolicy.max-history=30

